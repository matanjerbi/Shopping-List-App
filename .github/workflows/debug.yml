name: Debug chain
on:
  push:
    paths: [".github/debug-request.txt"]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r pipeline/requirements.txt
      - run: |
          while read -r chain user; do
            [ -z "$chain" ] && continue
            echo "===== $chain"
            python pipeline/debug_chain.py "$chain" "$user" 2>&1 | grep -v "INFO\|DEBUG" | head -400
          done < .github/debug-request.txt
